info:
  name: Approve Provider Batch
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/v1/admin/settlements/:batchId/approve"
  params:
    - name: batchId
      value: "{{batchId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
