info:
  name: Preview Merchant Document
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/v1/admin/merchant-applications/:profileId/documents/:documentId/preview"
  params:
    - name: profileId
      value: "{{profileId}}"
      type: path
    - name: documentId
      value: "{{documentId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
