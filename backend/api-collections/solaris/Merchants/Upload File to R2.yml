info:
  name: Upload File to R2
  type: http
  seq: 5

http:
  method: PUT
  url: "{{uploadUrl}}"
  headers:
    - name: Content-Type
      value: image/jpeg
  body:
    type: file
    data:
      - filePath: ./replace-with-document.jpg
        contentType: image/jpeg
        selected: false
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
