info:
  name: Get Transaction
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/transactions/:reference"
  params:
    - name: reference
      value: "{{publicReference}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
