info:
  name: Create Crypto Transaction
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/v1/transactions"
  headers:
    - name: Idempotency-Key
      value: solaris-crypto-example-001
  body:
    type: json
    data: |-
      {
        "paymentType": "CRYPTO",
        "provider": "NOWPAYMENTS",
        "asset": "USDT",
        "network": "TRC20",
        "amount": "25.75",
        "description": "Order INV-2048",
        "merchantReference": "INV-2048"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
