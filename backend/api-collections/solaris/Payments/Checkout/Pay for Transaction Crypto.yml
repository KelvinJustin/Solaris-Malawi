info:
  name: Pay for Transaction Crypto
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/v1/checkout/:token/pay"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: token
      value: replace-with-checkout-token
      type: path
  body:
    type: json
    data: |-
      {
        "provider": "NOWPAYMENTS"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
