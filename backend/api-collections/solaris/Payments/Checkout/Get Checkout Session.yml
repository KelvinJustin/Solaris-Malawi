info:
  name: Get Checkout Session
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/checkout/:token"
  params:
    - name: token
      value: "{{checkoutToken}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
