name: Smartpay
variables:
  - name: baseUrl
    value: http://localhost:3000
    description: API origin; include no /v1 suffix
  - name: profileId
    value: replace-with-merchant-profile-uuid
  - name: documentId
    value: replace-with-merchant-document-uuid
  - name: uploadId
    value: replace-with-upload-uuid
  - name: checkoutToken
    value: replace-with-checkout-token
  - name: publicReference
    value: replace-with-transaction-public-reference
  - name: attemptId
    value: 11111111-1111-4111-8111-111111111111
  - name: uploadUrl
    value: replace-with-presigned-url-from-upload-request
  - name: bankAccountId
    value: replace-with-bank-account-uuid
  - name: batchId
    value: replace-with-provider-batch-uuid
  - name: bankStatementLineId
    value: replace-with-bank-statement-line-uuid
  - name: callbackTimestamp
    value: replace-with-current-13-digit-epoch-milliseconds
  - name: callbackSignature
    value: replace-with-hmac-sha256-signature
  - name: nowPaymentsSignature
    value: replace-with-nowpayments-ipn-signature
  - name: nowPaymentsPaymentId
    value: replace-with-nowpayments-payment-id
